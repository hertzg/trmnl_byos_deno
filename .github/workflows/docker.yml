name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The UTC build instant is the whole build identity: the server bakes
      # it into the version's semver build metadata (0.1.0+20260714113000Z,
      # see server/src/build-info.ts). "+" is not a legal Docker tag
      # character, so the image is tagged with the bare stamp instead — the
      # tag is exactly the version's build-metadata part, derived from the
      # same instant that lands in the baked build-info.json.
      - id: version
        run: |
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "date=${date}" >> "$GITHUB_OUTPUT"
          echo "stamp=$(echo "${date}" | tr -d ':T-')" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.stamp }}
            type=sha,format=short

      # Gate the push on container acceptance tests: build the runner-arch
      # image from the same context and cache, boot it with dgoss, and run
      # docker/goss.yaml inside it (processes, ports, seeded config, baked
      # build identity, dashboard HTTP).
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: trmnl-byos:goss
          build-args: |
            BUILD_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha

      # Puts goss + dgoss on PATH (dgoss resolves GOSS_PATH via `which goss`).
      # Third-party action, hence pinned to the v1.3.0 commit.
      - uses: e1himself/goss-installation-action@3b8340a7c772f8064444f48b0df4c2a80d2e50fc # v1.3.0
        with:
          version: v0.4.9

      - name: Container tests (dgoss)
        run: |
          GOSS_FILES_PATH=docker GOSS_FILES_STRATEGY=cp \
            GOSS_OPTS="--retry-timeout 60s --sleep 2s" \
            dgoss run trmnl-byos:goss

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
