# Production stack for the Pi (ADR-0010, ADR-0012): runs the published image
# ghcr.io/hertzg/trmnl_byos_deno:latest (no local build), supervised by webproc.
# Unlike docker-compose.yml (local dev: `build: .` + source bind-mounts), this
# mounts only the live config. Deploy by fetching this file alongside the repo
# (simplest: `git clone --depth 1` the repo), then:
#
#   docker compose -f compose.stack.yaml up -d
#
# The entrypoint seeds live config from the baked *.example.ts starters on first
# boot and webproc lists them on :8080. The host ./config/live/ dir holds only live
# content (starters are image-owned). Point the Gallery at your iCloud Shared
# Album by editing config/live/plugins/gallery/album.ts (seeded from
# album.example.ts) on the host.
#
# Networking (slice #51): chrome shares the deno container's network namespace
# (`network_mode: service:trmnl-byos`) so it reaches the Renderer's loopback origin
# at 127.0.0.1:<ephemeral> — the seeded default in config/system.example.ts.
# Per ADR-0010 there is exactly one committed starter; environment-specific
# values are edits to this deployment's own mounted config/live/system.ts
# (via webproc on :8080), never a committed variant.
services:
  trmnl-byos:
    image: ghcr.io/hertzg/trmnl_byos_deno:latest
    container_name: trmnl-byos
    restart: unless-stopped
    ports:
      - "3000:3000"
      # webproc editor — local-only at the host; basic auth as a second layer.
      - "127.0.0.1:8080:8080"
    volumes:
      # Mounted live config tree (ADR-0010, ADR-0012): webproc-editable, survives image updates.
      - ./config/live:/app/config/live
    environment:
      TZ: "${TZ:-Etc/UTC}"
      # Basic auth for the webproc editor (:8080) — optional, off by default. Set
      # both (host env or a compose override) to enable it; the editor is already
      # bound local-only at 127.0.0.1:8080.
      WEBPROC_USER: "${WEBPROC_USER:-}"
      WEBPROC_PASS: "${WEBPROC_PASS:-}"

  chrome:
    image: cloakhq/cloakbrowser
    container_name: trmnl-byos-chrome
    command: cloakserve
    restart: unless-stopped
    # Share the deno container's network namespace so chrome can fetch the
    # Renderer's loopback origin at 127.0.0.1:<ephemeral> (slice #51).
    network_mode: "service:trmnl-byos"
    depends_on:
      trmnl-byos:
        condition: service_started
