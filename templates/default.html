<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://usetrmnl.com/css/latest/plugins.css">
  <script src="https://usetrmnl.com/js/latest/plugins.js"></script>
</head>
<body class="environment trmnl">
  <div class="screen">
    <div class="view view--full">
      <div class="layout">
        <div class="columns">
          <div class="column">
            <div class="markdown gap--large">
              <h1>${TITLE}</h1>
              <p>${SUBTITLE}</p>
              <p class="label label--small">${TIME}</p>
            </div>
          </div>
        </div>
      </div>
      <div class="title_bar">
        <span class="title">${HOSTNAME}</span>
        <span class="instance">deno-byos</span>
      </div>
    </div>
  </div>
</body>
</html>
