# Local dev compose: bind-mount source, deno --watch reload, dev-friendly env defaults.
# Run with: docker compose up --build
# For a device on your LAN to reach the server, set PUBLIC_URL_ORIGIN to the host's LAN IP, e.g.:
#   PUBLIC_URL_ORIGIN=http://192.168.1.10:3000 docker compose up
services:
  chrome:
    image: cloakhq/cloakbrowser
    container_name: trmnl-byos-chrome-dev
    command: cloakserve
    restart: unless-stopped
    # Exposed on the host so a non-Docker `deno task dev` can also point at it.
    ports:
      - "127.0.0.1:9222:9222"

  trmnl-byos-dev:
    build: .
    container_name: trmnl-byos-dev
    depends_on:
      chrome:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src:cached
      # Bind-mount the in-repo example as the runtime template. Already populated, so the
      # boot-time seeder is a no-op here. Swap the host side to point at your own template
      # dir (empty dirs get auto-seeded with the bundled example on first start).
      - ./templates/example:/app/template:cached
    environment:
      PUBLIC_URL_ORIGIN: "${PUBLIC_URL_ORIGIN:-http://127.0.0.1:3000}"
      # The chrome sidecar fetches our HTML from this URL. It must be reachable from
      # chrome's network namespace — that's the docker-network service name, not localhost.
      INTERNAL_URL_ORIGIN: "http://trmnl-byos-dev:3000"
      FRIENDLY_ID: "DEV"
      CDP_URL: "http://chrome:9222"
      DEVICE_ID: "trmnl-x"
      TZ: "${TZ:-Etc/UTC}"
    command:
      - deno
      - run
      - --allow-all
      - --watch=src,/app/template
      - src/main.ts
