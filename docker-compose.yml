# Local dev compose: bind-mount source, deno --watch reload, dev-friendly env defaults.
# Run with: docker compose up --build
# For a device on your LAN to reach the server, set PUBLIC_URL_ORIGIN to the host's LAN IP, e.g.:
#   PUBLIC_URL_ORIGIN=http://192.168.1.10:3000 docker compose up
#
# Networking note (slice #51): the Renderer owns a loopback HTTP origin on
# <loopback-host>:<ephemeral> that CDP fetches the Bundle (HTML + assets)
# from. In compose mode chrome shares the deno container's network namespace
# (`network_mode: service:trmnl-byos-dev`) so 127.0.0.1 resolves to the deno
# process — and that's exactly the value we pin LOOPBACK_HOST to below, so
# the Renderer binds the ephemeral port on the loopback interface only and
# nothing outside the container can reach it. The CDP HTTP port (9222) is
# reached via the same shared loopback at http://localhost:9222.
#
# Why the explicit pin: the production default is "host.docker.internal" so
# the `deno task dev` workflow (deno on the host, chrome in docker) Just
# Works without env overrides. Compose mode is the opposite case and opts
# out by setting LOOPBACK_HOST=127.0.0.1 in the environment block.
services:
  trmnl-byos-dev:
    build: .
    container_name: trmnl-byos-dev
    ports:
      - "3000:3000"
      # Exposed on the host so a non-Docker workflow can also point at CDP.
      - "127.0.0.1:9222:9222"
    volumes:
      - ./src:/app/src:cached
      # Bind-mount the bundled Plugin + DesignSystem so dev edits hot-reload.
      - ./templates:/app/templates:cached
    environment:
      PUBLIC_URL_ORIGIN: "${PUBLIC_URL_ORIGIN:-http://127.0.0.1:3000}"
      # CDP shares this container's network namespace, so localhost reaches it.
      CDP_URL: "http://localhost:9222"
      # Compose-mode pin: see the networking note at the top of this file.
      # Production default is "host.docker.internal" for the deno-task-dev
      # workflow; here we keep the ephemeral loopback port bound on the
      # container's loopback interface only.
      LOOPBACK_HOST: "127.0.0.1"
      FRIENDLY_ID: "DEV"
      DEVICE_ID: "trmnl-x"
      TZ: "${TZ:-Etc/UTC}"
    command:
      - deno
      - run
      - --allow-all
      - --watch=src,templates
      - src/main.ts

  chrome:
    image: cloakhq/cloakbrowser
    container_name: trmnl-byos-chrome-dev
    command: cloakserve
    restart: unless-stopped
    # Share the deno container's network namespace so chrome can fetch the
    # Renderer's loopback origin at 127.0.0.1:<ephemeral>. Slice #51 made
    # this required — before it, CDP fetched a public /preview route on the
    # outward server, which was reachable cross-container via the docker
    # network.
    network_mode: "service:trmnl-byos-dev"
    depends_on:
      trmnl-byos-dev:
        condition: service_started
