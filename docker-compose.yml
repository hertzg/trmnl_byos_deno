# Local dev compose — now mirrors the Pi deployment (ADR-0010): the image's
# webproc entrypoint supervises the Deno server and serves a config editor on
# :8080. Run with: docker compose up --build
#
# Config comes from the mounted ./config volume, not env vars (env-var config
# loading was removed in ADR-0010). The only genuine runtime env knob left is TZ;
# WEBPROC_USER/WEBPROC_PASS gate the :8080 editor and are injectable.
#
# Hot reload: editing config/ files through the webproc editor (:8080) bounces
# Deno on save (--on-save restart). Code edits under src/ and templates/ are
# bind-mounted but no longer deno-watched (webproc owns supervision now); pick
# them up with `docker compose restart trmnl-byos-dev`.
#
# Networking note (slice #51): the Renderer owns a loopback HTTP origin on
# <loopbackHost>:<ephemeral> that CDP fetches the Bundle (HTML + assets) from.
# In compose mode chrome shares the deno container's network namespace
# (`network_mode: service:trmnl-byos-dev`) so 127.0.0.1 resolves to the deno
# process. The production default in config/system.example.ts is
# "host.docker.internal" (for the `deno task dev` flow: deno on the host, chrome
# in docker). Compose needs the opposite, and env overrides are gone — so we
# bind-mount the committed config/system.compose.example.ts (loopbackHost =
# 127.0.0.1) directly onto the container's config/system.ts, overriding just
# that file. The deno-task-dev / Pi config/system.ts is untouched.
services:
  trmnl-byos-dev:
    build: .
    container_name: trmnl-byos-dev
    ports:
      - "3000:3000"
      # webproc editor — local-only at the host; basic auth as a second layer.
      - "127.0.0.1:8080:8080"
      # Exposed on the host so a non-Docker workflow can also point at CDP.
      - "127.0.0.1:9222:9222"
    volumes:
      - ./src:/app/src:cached
      # Bundled Plugin + DesignSystem; bind-mounted so edits survive a restart.
      - ./templates:/app/templates:cached
      # Mounted config tree (ADR-0010): webproc-editable, survives rebuilds.
      - ./config:/app/config:cached
      # Compose-mode loopbackHost override: see the networking note above.
      - ./config/system.compose.example.ts:/app/config/system.ts:cached
    environment:
      TZ: "${TZ:-Etc/UTC}"
      # Basic auth for the webproc editor (:8080). Overridable via host env.
      WEBPROC_USER: "${WEBPROC_USER:-admin}"
      WEBPROC_PASS: "${WEBPROC_PASS:-trmnl}"

  chrome:
    image: cloakhq/cloakbrowser
    container_name: trmnl-byos-chrome-dev
    command: cloakserve
    restart: unless-stopped
    # Share the deno container's network namespace so chrome can fetch the
    # Renderer's loopback origin at 127.0.0.1:<ephemeral>. Slice #51 made
    # this required — before it, CDP fetched a public /preview route on the
    # outward server, which was reachable cross-container via the docker
    # network.
    network_mode: "service:trmnl-byos-dev"
    depends_on:
      trmnl-byos-dev:
        condition: service_started
